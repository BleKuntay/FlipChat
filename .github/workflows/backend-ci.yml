name: Backend CI (Unit Test Only)

on:
  push:
    branches-ignore:
      - 'main'
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Display Go version
        run: go version

      - name: Install dependencies
        run: go mod download

      - name: Run unit test
        run: go test -v -json ./... > TestResults-1.25.json

      - name: Upload test result 
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Go-results-1.25
          path: backend/TestResults-1.25.json