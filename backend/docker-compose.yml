services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fc_app
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: fc_postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: fc_user
      POSTGRES_PASSWORD: fc_password
      POSTGRES_DB: flip_chat
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fc_user -d flip_chat"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
