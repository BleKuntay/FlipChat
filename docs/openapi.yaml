openapi: "3.1.0"

info:
  title: FlipChat API
  version: "0.2.0"
  description: |
    REST API for FlipChat — a real-time one-to-one chat application.

    **Versioning:** follows SemVer 0.y.z during development.
    Minor version increments (0.1.0 → 0.2.0) correspond to feature phases.
    1.0.0 marks the first stable, publicly committed API contract.

    **Real-time events** are delivered over WebSocket. See `docs/websocket.md`
    for the full event schema and connection protocol.

servers:
  - url: http://localhost:8080/v1
    description: Local development
  - url: https://api.flipchat.app/v1
    description: Production (placeholder — not yet deployed)

tags:
  - name: auth
    description: Registration, login, logout, and token refresh
  - name: users
    description: User profile management and search
  - name: friends
    description: Friend requests and friendship management
  - name: blocks
    description: Block and unblock users
  - name: conversations
    description: One-to-one conversation management
  - name: messages
    description: Sending, editing, deleting, and reading messages
  - name: attachments
    description: Image upload and download (JPEG, PNG, GIF, WebP — max 5 MB)
  - name: websocket
    description: Real-time event stream. See docs/websocket.md for full protocol.

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "invalid or expired token"

    Forbidden:
      description: Action not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "forbidden"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "not found"

    Conflict:
      description: Resource already exists or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "conflict"

    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "bad request"

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "internal server error"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "not found"

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        username:
          type: string
        avatar_url:
          type: [string, "null"]
          format: uri
        is_online:
          type: boolean
          description: Whether the user currently has an active WebSocket connection
        last_seen_at:
          type: [string, "null"]
          format: date-time

    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            bio:
              type: [string, "null"]
            language:
              type: string
              example: "en"
            created_at:
              type: string
              format: date-time

    MeResponse:
      allOf:
        - $ref: '#/components/schemas/UserDetail'
        - type: object
          properties:
            email:
              type: string
              format: email

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        user:
          $ref: '#/components/schemas/MeResponse'

    FriendResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        full_name:
          type: string
        friend_since:
          type: string
          format: date-time

    FriendRequestResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        full_name:
          type: string
        direction:
          type: string
          enum: [sent, received, accepted]
        status:
          type: string
          enum: [pending, accepted]
        created_at:
          type: string
          format: date-time

    BlockedUserResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
        avatar_url:
          type: [string, "null"]
          format: uri
        blocked_at:
          type: string
          format: date-time

    ConversationResponse:
      type: object
      properties:
        conversation_id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name of the other participant
        username:
          type: string
          description: Username of the other participant
        avatar_url:
          type: [string, "null"]
          format: uri
        last_message_preview:
          type: [string, "null"]
          description: Content of the most recent message
        last_message_at:
          type: [string, "null"]
          format: date-time

    AttachmentMetadata:
      type: object
      description: |
        Attachment metadata embedded in a MessageResponse when the message
        carries a file. The download URL is not included here — use
        `GET /attachments/{attachment_id}` to fetch the file.
      properties:
        attachment_id:
          type: string
          format: uuid
        filename:
          type: string
          example: "photo.jpg"
        mime_type:
          type: string
          enum: [image/jpeg, image/png, image/gif, image/webp]
        size:
          type: integer
          description: File size in bytes (max 5242880)
          example: 204800

    MessageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 — time-ordered, used as pagination cursor
        conversation_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        content:
          type: [string, "null"]
          description: null when the message has been deleted
        reply_to_id:
          type: [string, "null"]
          format: uuid
        metadata:
          oneOf:
            - $ref: '#/components/schemas/AttachmentMetadata'
            - type: "null"
          description: Present only for messages with an attachment, null otherwise
        is_edited:
          type: boolean
          default: false
        is_deleted:
          type: boolean
          default: false
          description: When true, content is null and metadata is null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
          description: Set when the message has been edited
        read_at:
          type: [string, "null"]
          format: date-time
          description: Set when the recipient has marked this message as read

    UploadResponse:
      type: object
      properties:
        attachment_id:
          type: string
          format: uuid
          description: |
            Pass this as `attachment_id` in the SendMessage request body.
            Valid for 1 hour. After that the record is expired and the upload
            must be repeated.
        filename:
          type: string
          example: "photo.jpg"
        mime_type:
          type: string
          enum: [image/jpeg, image/png, image/gif, image/webp]
        size:
          type: integer
          example: 204800

paths:
  /auth/register:
    $ref: './paths/auth.yaml#/paths/~1auth~1register'
  /auth/login:
    $ref: './paths/auth.yaml#/paths/~1auth~1login'
  /auth/logout:
    $ref: './paths/auth.yaml#/paths/~1auth~1logout'
  /auth/logout-all:
    $ref: './paths/auth.yaml#/paths/~1auth~1logout-all'
  /auth/refresh:
    $ref: './paths/auth.yaml#/paths/~1auth~1refresh'

  /users/me:
    $ref: './paths/users.yaml#/paths/~1users~1me'
  /users/me/email:
    $ref: './paths/users.yaml#/paths/~1users~1me~1email'
  /users/me/password:
    $ref: './paths/users.yaml#/paths/~1users~1me~1password'
  /users/search:
    $ref: './paths/users.yaml#/paths/~1users~1search'
  /users/{id}:
    $ref: './paths/users.yaml#/paths/~1users~1{id}'

  /friends:
    $ref: './paths/friends.yaml#/paths/~1friends'
  /friends/requests:
    $ref: './paths/friends.yaml#/paths/~1friends~1requests'
  /friends/{id}:
    $ref: './paths/friends.yaml#/paths/~1friends~1{id}'
  /friends/requests/{id}/accept:
    $ref: './paths/friends.yaml#/paths/~1friends~1requests~1{id}~1accept'
  /friends/requests/{id}/decline:
    $ref: './paths/friends.yaml#/paths/~1friends~1requests~1{id}~1decline'

  /blocks:
    $ref: './paths/blocks.yaml#/paths/~1blocks'
  /blocks/{id}:
    $ref: './paths/blocks.yaml#/paths/~1blocks~1{id}'

  /conversations:
    $ref: './paths/conversations.yaml#/paths/~1conversations'
  /conversations/{id}:
    $ref: './paths/conversations.yaml#/paths/~1conversations~1{id}'

  /conversations/{id}/messages:
    $ref: './paths/messages.yaml#/paths/~1conversations~1{id}~1messages'
  /conversations/{id}/messages/{msg_id}:
    $ref: './paths/messages.yaml#/paths/~1conversations~1{id}~1messages~1{msg_id}'
  /conversations/{id}/messages/{msg_id}/read:
    $ref: './paths/messages.yaml#/paths/~1conversations~1{id}~1messages~1{msg_id}~1read'

  /attachments/upload:
    $ref: './paths/attachments.yaml#/paths/~1attachments~1upload'
  /attachments/{id}:
    $ref: './paths/attachments.yaml#/paths/~1attachments~1{id}'

  /ws:
    $ref: './paths/ws.yaml#/paths/~1ws'