paths:
  /blocks:
    get:
      tags: [blocks]
      summary: List blocked users
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Cursor from previous page for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of blocked users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../openapi.yaml#/components/schemas/BlockedUserResponse'
                  next_cursor:
                    type: [string, "null"]
        "401":
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        "500":
          $ref: '../openapi.yaml#/components/responses/InternalServerError'

  /blocks/{id}:
    post:
      tags: [blocks]
      summary: Block a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: User blocked successfully
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/BlockedUserResponse'
        "400":
          $ref: '../openapi.yaml#/components/responses/BadRequest'
        "401":
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        "404":
          $ref: '../openapi.yaml#/components/responses/NotFound'
        "409":
          $ref: '../openapi.yaml#/components/responses/Conflict'
        "500":
          $ref: '../openapi.yaml#/components/responses/InternalServerError'

    delete:
      tags: [blocks]
      summary: Unblock a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User unblocked successfully
        "400":
          $ref: '../openapi.yaml#/components/responses/BadRequest'
        "401":
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        "404":
          $ref: '../openapi.yaml#/components/responses/NotFound'
        "500":
          $ref: '../openapi.yaml#/components/responses/InternalServerError'