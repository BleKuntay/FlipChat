paths:
  /users/me:
    get:
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/MeResponse'
        "401":
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        "500":
          $ref: '../openapi.yaml#/components/responses/InternalServerError'

    patch:
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "New Name"
                username:
                  type: string
                  example: "newusername"
                bio:
                  type: string
                  example: "Hello world"
                language:
                  type: string
                  example: "id"
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/UserDetail'
        "400":
          $ref: '../openapi.yaml#/components/responses/BadRequest'
        "401":
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        "409":
          $ref: '../openapi.yaml#/components/responses/Conflict'
        "500":
          $ref: '../openapi.yaml#/components/responses/InternalServerError'

    delete:
      tags: [users]
      summary: Delete current user account
      responses:
        "204":
          description: Account deleted successfully
        "401":
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        "500":
          $ref: '../openapi.yaml#/components/responses/InternalServerError'

  /users/me/email:
    patch:
      tags: [users]
      summary: Update current user email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_email]
              properties:
                current_password:
                  type: string
                  format: password
                  example: "Secret123"
                new_email:
                  type: string
                  format: email
                  example: "newemail@example.com"
      responses:
        "200":
          description: Email updated successfully
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/MeResponse'
        "400":
          $ref: '../openapi.yaml#/components/responses/BadRequest'
        "401":
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        "409":
          $ref: '../openapi.yaml#/components/responses/Conflict'
        "500":
          $ref: '../openapi.yaml#/components/responses/InternalServerError'

  /users/me/password:
    patch:
      tags: [users]
      summary: Change current user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, confirm_password]
              properties:
                current_password:
                  type: string
                  format: password
                  example: "Secret123"
                new_password:
                  type: string
                  format: password
                  example: "NewSecret456"
                confirm_password:
                  type: string
                  format: password
                  example: "NewSecret456"
      responses:
        "204":
          description: Password changed successfully
        "400":
          $ref: '../openapi.yaml#/components/responses/BadRequest'
        "401":
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        "500":
          $ref: '../openapi.yaml#/components/responses/InternalServerError'

  /users/search:
    get:
      tags: [users]
      summary: Search users by username
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          example: "test"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Cursor from previous page for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../openapi.yaml#/components/schemas/UserSummary'
                  next_cursor:
                    type: string
                    nullable: true
        "401":
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        "500":
          $ref: '../openapi.yaml#/components/responses/InternalServerError'

  /users/{id}:
    get:
      tags: [users]
      summary: Get public profile of a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User public profile
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/UserDetail'
        "401":
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        "404":
          $ref: '../openapi.yaml#/components/responses/NotFound'
        "500":
          $ref: '../openapi.yaml#/components/responses/InternalServerError'